<!doctype html>
<html lang="en">
  <head>
    <title>login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body style="background: #bde899;
background: linear-gradient(90deg, rgba(189, 232, 153, 0.46) 30%, rgba(218, 159, 191, 1) 71%, rgba(232, 125, 209, 0.94) 92%, rgba(237, 221, 83, 1) 100%);">
   <div class="container">
    <div class="row">
        <div class="col">
            
        </div>
        <div class="col" style="margin-top: 130px;box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px; padding: 50px;border-radius: 5px; border:2px tomato solid;
        background: #b7e691;
background: linear-gradient(90deg, rgba(183, 230, 145, 0.46) 21%, rgba(87, 199, 133, 1) 87%, rgba(237, 221, 83, 1) 100%);">
             <form>
             <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
        <div class="col">
            
        </div>

    </div>

   </div>

  </body>
  </html>
